<template id="letter-source"><div>
     <p>Mon amour,</p>
     <p>Un an avec toi. Quand j’y pense, je revois plein de petits moments, et je me rends compte à quel point tu as pris une place immense dans ma vie. Nos rires, nos câlins, nos discussions, nos délires que personne d’autre ne comprendrait… Tout ça, c’est nous. Et c’est ce que j’ai de plus précieux.</p>
     <p>J’aime repenser aux moments où on rigole pour rien, où il suffit d’un regard pour qu’on se comprenne et qu’on reparte dans un fou rire. À nos bêtises, à nos photos, à ces instants où on ne fait rien de particulier, mais où je suis bien parce que tu es là. Parfois, j’aimerais pouvoir les revivre juste quelques minutes, retrouver exactement ce qu’on ressentait à ce moment-là.</p>
     <p>Il y a aussi les moments qui m’ont fait peur. Je repense à cette fois où j’ai foncé dans les gaz lacrymogènes sans réfléchir, parce que j’avais peur pour toi et que je voulais te sortir de là. Je ne raconte pas ça pour faire le héros : j’étais terrifié à l’idée qu’il puisse t’arriver quelque chose. Avec le recul, ce que je veux, c’est qu’on puisse se protéger tous les deux et rentrer ensemble, en sécurité. Cette peur m’a fait sentir très fort la place que tu occupes dans mon cœur.</p>
     <p>Mais surtout, quand je pense à notre année, c’est ton sourire que je veux garder en tête. Ton rire. Ta façon de me regarder. Le bonheur de te retrouver et de pouvoir te prendre dans mes bras. Tous ces détails qui peuvent paraître minuscules et qui, pour moi, font toute la différence.</p>
     <p>On a aussi vécu des moments moins faciles. On n’a pas toujours les bons mots, on peut se comprendre de travers ou ne pas savoir comment dire ce qu’on ressent. Je sais que je ne suis pas parfait. Mais je veux apprendre à mieux t’écouter, à te comprendre et à te montrer que tu comptes pour moi, même dans les journées où je m’exprime moins bien.</p>
     <p>C’est aussi pour ça que j’ai voulu écrire ces <span data-word-count>457</span> mots qui me font penser à toi. En les cherchant, je repense à ce que j’aime chez toi et à tout ce qu’on a vécu. Certains me font sourire, d’autres me rappellent un moment précis. Aucun ne dit tout à lui seul, mais chacun porte un petit morceau de ce que je ressens pour toi.</p>
     <p>Tu es l’amour de ma vie. Et quand je t’écris ça, je pense autant aux souvenirs qu’on a déjà qu’à tout ce que j’ai envie de vivre avec toi. Voyager, découvrir des endroits, réaliser nos projets, mais aussi partager des journées toutes simples. Se raconter ce qui nous est arrivé, rire d’une connerie, choisir un film et profiter d’être ensemble.</p>
     <p>Je ne peux pas te promettre qu’on aura toujours les réponses ou que tout sera facile. Je peux te dire que j’ai envie de faire les efforts nécessaires pour prendre soin de notre relation. De continuer à te découvrir, de respecter la personne que tu es et de te soutenir dans ce qui compte pour toi.</p>
     <p>Merci pour cette première année. Merci pour ta tendresse, pour nos fous rires et pour la confiance que tu me donnes. J’espère que, quand tu repenseras à nous, tu ressentiras toi aussi cette chaleur que j’ai en repensant à tous nos moments.</p>
     <p>Si je pouvais revenir au début de notre histoire, en sachant tout ce qu’on allait vivre, j’aurais toujours envie de venir vers toi.</p>
     <p>Joyeux un an, mon amour. J’ai encore tellement de souvenirs à créer avec toi.</p>
     <p>Je t’aime.</p>
     <p>Ton amoureux ❤</p>
    </div></template>
